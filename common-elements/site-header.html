<style>
    /* Header name: English by default; on hover it turns into Bengali, one word
       at a time. Both lines share one grid cell (Bengali anchored at the same
       left edge), so the header never changes size. Touch screens keep English. */
    .nav-name a.name-morph { display: inline-grid; align-items: center; }
    .name-morph .nm-en,
    .name-morph .nm-bn { grid-area: 1 / 1; justify-self: start; white-space: nowrap; }
    .name-morph .nm-en > span,
    .name-morph .nm-bn > span { display: inline-block; transition: opacity 0.45s ease, filter 0.45s ease, transform 0.45s ease; }
    .name-morph .nm-bn { font-family: "Noto Serif Bengali", serif; font-weight: 700; font-size: 1.04em; word-spacing: 0.06em; line-height: 1; }
    .name-morph .nm-bn > span { opacity: 0; filter: blur(4px); transform: translateY(0.18em); }
    .name-morph span > span:nth-child(2) { transition-delay: 0.05s; }
    .name-morph span > span:nth-child(3) { transition-delay: 0.1s; }
    @media (hover: hover) and (pointer: fine) {
        .name-morph:hover .nm-en > span,
        .name-morph:focus-visible .nm-en > span { opacity: 0; filter: blur(4px); transform: translateY(-0.18em); }
        .name-morph:hover .nm-bn > span,
        .name-morph:focus-visible .nm-bn > span { opacity: 1; filter: none; transform: none; }
        /* a short pause first, so merely passing over the name does nothing */
        .name-morph:hover span > span:nth-child(1) { transition-delay: 0.15s; }
        .name-morph:hover span > span:nth-child(2) { transition-delay: 0.24s; }
        .name-morph:hover span > span:nth-child(3) { transition-delay: 0.33s; }
    }
    /* touch screens: a tap on the name toggles .is-bn (javascript/name-morph.js) */
    .name-morph.is-bn .nm-en > span { opacity: 0; filter: blur(4px); transform: translateY(-0.18em); }
    .name-morph.is-bn .nm-bn > span { opacity: 1; filter: none; transform: none; }
    @media (prefers-reduced-motion: reduce) {
        .name-morph .nm-en > span, .name-morph .nm-bn > span { filter: none !important; transform: none !important; transition-duration: 0.2s; }
    }
</style>
